server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: maverick-labs-be
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  packages-to-scan:
    - com.danyaell.mavericklabsbe.game.controller

  paths-to-match:
    - /api/v1/**

# CORS Configuration
app:
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

