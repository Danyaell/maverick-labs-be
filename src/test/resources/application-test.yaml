spring:
  application:
    name: maverick-labs-be

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  sql:
    init:
      mode: never